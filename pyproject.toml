[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supportops-ai"
version = "0.2.0"
description = "Production-oriented AI customer operations platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
