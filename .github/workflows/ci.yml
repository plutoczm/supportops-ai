name: ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: supportops_ci
          POSTGRES_USER: supportops
          POSTGRES_PASSWORD: supportops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportops -d supportops_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall app evals migrations
      - name: Compose config
        run: |
          docker compose config -q
          docker compose --profile rag config -q
      - name: PostgreSQL migration contract
        env:
          DATABASE_URL: postgresql+psycopg://supportops:supportops@localhost:5432/supportops_ci
        run: |
          alembic upgrade head
          alembic current --check-heads
          alembic check
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75
      - name: Offline agent safety eval
        run: python -m evals.run_evals
      - name: Offline retrieval eval
        run: python -m evals.run_retrieval_evals
      - name: Container build
        run: docker build -t supportops-ai:ci .
